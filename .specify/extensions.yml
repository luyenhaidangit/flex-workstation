# SpecKit Extensions — v1.0
# Hooks tự động chạy trước/sau mỗi phase của SpecKit.
# Variables: {feature_id} = branch short name, {date} = YYYY-MM-DD

hooks:
  before_specify:
    - extension: enforce-spec-template
      command: speckit:clarify
      description: >
        Đọc và ghi nhớ template spec chuẩn trước khi generate spec.md.
        Đảm bảo spec sinh ra tuân thủ đúng cấu trúc section 0->12 tiếng Việt.
      prompt: >
        TRƯỚC KHI tạo spec.md, hãy đọc file `.specify/templates/spec-template.md`
        và ghi nhớ TOÀN BỘ cấu trúc. Xác nhận bằng cách liệt kê tất cả section headings
        (## 0 -> ## 12) từ template đó.

        Khi viết spec.md, BẮT BUỘC:
        - Copy nguyên văn toàn bộ section headings từ template (số thứ tự + tiêu đề tiếng Việt)
        - Chỉ thay thế nội dung [placeholder] bằng thông tin thực tế
        - KHÔNG thêm, bớt, đổi tên, đổi thứ tự bất kỳ section nào
        - KHÔNG dùng format cũ: "Feature Specification:", "User Story N", "Success Criteria" tiếng Anh
      optional: false
      enabled: true

  before_plan:
    - extension: knowledge-base-check
      command: speckit:context
      description: >
        Kiểm tra knowledge base có domain rules, patterns liên quan đến feature sắp plan.
      prompt: >
        Trước khi plan feature này, hãy đọc knowledge base của dự án để xác định
        các domain rules và patterns liên quan. Báo cáo ngắn gọn:
        - Những rules/patterns đã có áp dụng cho feature này
        - Những gaps còn thiếu cần quyết định
      optional: true
      enabled: true

  after_plan:
    - extension: plan-report-writer
      command: speckit:write-plan-report
      description: "Ghi plan.report.md tổng hợp kết quả phase plan"
      prompt: >
        Sau khi hoàn thành plan, tạo file `.specify/specs/{feature_id}/report/plan.report.md`
        với nội dung:
        - Tổng số tasks đã plan
        - Danh sách tasks theo thứ tự dependency
        - Risks và assumptions đã xác định
        - Estimated effort (nếu có)
      optional: false
      enabled: true

  before_implement:
    - extension: coding-rules-check
      command: speckit:context
      description: >
        Load coding rules và patterns của dự án trước khi implement.
        Đảm bảo agent dùng đúng conventions thay vì tự suy luận.
      prompt: >
        TRƯỚC KHI implement bất kỳ task nào, hãy đọc knowledge base/rules liên quan
        đến task hiện tại.

        Sau khi đọc, xác nhận:
        "Đã load coding rules cho session này. Áp dụng: [danh sách rules]"
      optional: false
      enabled: true

  after_implement:
    - extension: implement-report-writer
      command: speckit:write-implement-report
      description: "Ghi implement.report.md tổng hợp kết quả phase implement"
      prompt: >
        Sau khi hoàn thành implement, tạo file `.specify/specs/{feature_id}/report/implement.report.md`
        với nội dung:
        - Danh sách tasks đã hoàn thành
        - Files đã thay đổi
        - Tests đã thêm/sửa
        - Những vấn đề phát sinh và cách giải quyết
      optional: false
      enabled: true
