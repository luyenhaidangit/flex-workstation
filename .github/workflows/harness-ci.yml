name: Harness CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill catalog
        run: node scripts/validate-skills.js

      - name: Run harness unit tests
        run: node --test tests/harness.test.js
