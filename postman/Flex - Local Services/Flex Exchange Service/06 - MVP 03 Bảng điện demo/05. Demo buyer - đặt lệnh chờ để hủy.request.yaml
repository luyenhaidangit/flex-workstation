$kind: http-request
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  X-Correlation-Id: "{{exchangeCorrelationId}}"
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBuyerBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Buy",
      "price": 19000,
      "quantity": 100
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.accepted && response.orderId) {
          pm.collectionVariables.set("exchangeBuyerOrderId", response.orderId);
      }
    language: text/javascript
order: 5000
