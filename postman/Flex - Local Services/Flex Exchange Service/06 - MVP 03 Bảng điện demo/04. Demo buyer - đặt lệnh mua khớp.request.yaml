$kind: http-request
description: Chạy sau request 03. Sau khi khớp, kiểm tra lại order book và trade tape.
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  X-Correlation-Id: "{{exchangeCorrelationId}}"
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBuyerBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Buy",
      "price": 20000,
      "quantity": 100
    }
order: 4000
