$kind: http-request
description: Lưu orderId từ response vào collection variable để request hủy dùng tự động.
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Sell",
      "price": 21000,
      "quantity": 100
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.accepted && response.orderId) {
          pm.collectionVariables.set("exchangeOrderId", response.orderId);
      }
    language: text/javascript
order: 1000
