$kind: http-request
description: Chạy sau request 01 để tạo TradeExecuted với khối lượng 100.
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Buy",
      "price": 20000,
      "quantity": 100
    }
order: 2000
