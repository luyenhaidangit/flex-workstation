$kind: http-request
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Sell",
      "price": 20000,
      "quantity": 100
    }
order: 3000
