$kind: http-request
description: Chạy sau request 03. Lệnh mua còn dư 100 trong order book.
url: "{{exchangeBaseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brokerId": "{{exchangeBrokerId}}",
      "symbol": "{{exchangeSymbol}}",
      "side": "Buy",
      "price": 20000,
      "quantity": 200
    }
order: 4000
