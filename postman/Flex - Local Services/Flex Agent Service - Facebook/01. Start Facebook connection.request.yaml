$kind: http-request
url: "{{agentBaseUrl}}/api/channels/facebook/connect"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "agentId": "{{facebookAgentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.state) pm.collectionVariables.set('facebookState', response.state);
    language: text/javascript
order: 1000
