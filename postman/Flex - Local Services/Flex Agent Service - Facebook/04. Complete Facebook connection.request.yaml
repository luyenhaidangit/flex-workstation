$kind: http-request
url: "{{agentBaseUrl}}/api/channels/facebook/connections/complete"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "agentId": "{{facebookAgentId}}",
      "state": "{{facebookState}}",
      "resourceId": "{{facebookResourceId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.connectionId) pm.collectionVariables.set('facebookConnectionId', response.connectionId);
    language: text/javascript
order: 4000
